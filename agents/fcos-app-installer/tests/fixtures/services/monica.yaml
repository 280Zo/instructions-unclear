# Test fixture: three containers (app, cron, MariaDB), root-start images,
# a private network, a MariaDB backup and a files backup. Example values only.
name: monica
vm: apps
uid: 3110
title: Monica
login: authentik
hostname: monica
api_paths: ["^/dav/.*$", "^/\\.well-known/(carddav|caldav)$"]
port: 8110
containers:
  - name: app
    image: docker.io/library/monica:4-apache
    user_mode: root-start
    add_capabilities: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, NET_BIND_SERVICE]
    publish: 80
    depends_on: [db]
    env:
      APP_ENV: production
      APP_NAME: Example CRM
      DB_HOST: monica-db
      DB_DATABASE: monica
      DB_USERNAME: monica
    secrets: [{env: APP_KEY, name: monica_app_key}, {env: DB_PASSWORD, name: monica_db_password}]
    volumes:
      - {path: /var/www/html/storage, class: local, expected_gib: 1}
  - name: cron
    image: docker.io/library/monica:4-apache
    user_mode: root-start
    add_capabilities: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, NET_BIND_SERVICE]
    command: [cron.sh]
    depends_on: [db]
    env:
      APP_ENV: production
      DB_HOST: monica-db
      DB_DATABASE: monica
      DB_USERNAME: monica
    secrets: [{env: APP_KEY, name: monica_app_key}, {env: DB_PASSWORD, name: monica_db_password}]
    volumes:
      - {path: /var/www/html/storage, class: local, expected_gib: 1}
  - name: db
    image: docker.io/library/mariadb:11
    user_mode: root-start
    add_capabilities: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    env:
      MARIADB_DATABASE: monica
      MARIADB_USER: monica
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    secrets: [{env: MARIADB_PASSWORD, name: monica_db_password}]
    volumes:
      - {path: /var/lib/mysql, class: local-db, engine: mariadb, expected_gib: 1}
secrets:
  - {name: monica_db_password, durable: true}
  - {name: monica_app_key, durable: true, source: prompt}
backups: {schedule: daily, keep: 14}
